<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locky App</title>
<meta name="description" content="Prototipo interactivo de la app Locky: recordatorios, ficha clínica, mapa, SOS, logros y familia.">
<meta name="theme-color" content="#127C8C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* =========================================================
   LOCKY · Prototipo de la app (versión para presentación)
   Layout: en computador, un teléfono al centro con una guía
   de demo al lado; en celular, la app ocupa toda la pantalla.
   Todos los datos son de ejemplo y se guardan solo en este
   navegador. Nada se envía a internet.
   ========================================================= */
:root {
  /* Marca (igual que la web) */
  --teal: #127C8C; --teal-deep: #0B5662; --coral: #FF7A59; --sun: #FFC845;
  --ink: #1F2933; --white: #FFFFFF; --alert: #D64545; --ok: #1E8A5A; --warn: #B7791F;
  /* Neutros de la app (cambian con el tema) */
  --bg: #FFF9F4; --card: #FFFFFF; --soft: #FDEEE5; --tint: #E2F1F2;
  --fg: #1F2933; --muted: #56626C; --line: #EADCD2; --chip: #EEF2F3;
  --tab-bg: #FFFFFF; --link: #0D6B79; --stage: #127C8C;
  --font-display: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1C1F; --card: #172A2E; --soft: #2B201C; --tint: #13343B;
    --fg: #EEF3F2; --muted: #A6B5B9; --line: #29404A; --chip: #22383D;
    --tab-bg: #13252A; --link: #7FD3DD; --stage: #0B3F47; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1C1F; --card: #172A2E; --soft: #2B201C; --tint: #13343B;
  --fg: #EEF3F2; --muted: #A6B5B9; --line: #29404A; --chip: #22383D;
  --tab-bg: #13252A; --link: #7FD3DD; --stage: #0B3F47; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--fg); font: 400 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Escenario: guía + teléfono ---------- */
.stage {
  min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 48px;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.guide { display: none; color: var(--white); max-width: 330px; }
.guide h1 { font-size: 2.3rem; font-weight: 900; }
.guide p { opacity: .92; margin-top: 10px; }
.guide .badge { display: inline-block; margin-bottom: 14px; padding: 6px 12px; border-radius: 99px; background: var(--ink); color: var(--sun); font-weight: 800; font-size: .8rem; letter-spacing: .05em; text-transform: uppercase; }
.guide nav { display: grid; gap: 8px; margin-top: 22px; }
.guide nav button { text-align: left; background: rgba(255,255,255,.12); color: var(--white); border: 2px solid rgba(255,255,255,.35); border-radius: 14px; padding: 10px 14px; font-weight: 700; }
.guide nav button:hover { background: var(--sun); color: var(--ink); border-color: var(--ink); }
.guide small { display: block; margin-top: 18px; opacity: .8; font-size: .8rem; }
@media (min-width: 900px) { .guide { display: block; } }

.device {
  position: relative; width: 390px; max-width: 100%; height: min(844px, calc(100vh - 48px)); min-height: 640px;
  border: 12px solid #111A1D; border-radius: 52px; box-shadow: 14px 16px 0 var(--ink);
  overflow: hidden; background: var(--bg);
}
/* En celular: la app ocupa toda la pantalla */
@media (max-width: 599px) {
  body { background: var(--bg); }
  .stage { padding: 0; display: block; min-height: 0; height: 100%; }
  .device { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
}

/* ---------- Estructura interna de la app ---------- */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.statusbar { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 10px 26px 4px; font-weight: 700; font-size: 13px; }
@media (max-width: 599px) { .statusbar { display: none; } }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.statusbar .icons i { display: block; width: 18px; height: 10px; border-radius: 3px; border: 2px solid currentColor; }
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 18px 110px; scroll-behavior: smooth; }
.screen.full { padding: 0; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 6px 0 14px; }
.topbar h1 { font-size: 1.55rem; font-weight: 900; flex: 1; }
.icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 14px; border: 2px solid var(--ink); background: var(--card); color: var(--fg); }
.icon-btn svg { width: 22px; height: 22px; }

/* Barra de pestañas */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--tab-bg); border-top: 2px solid var(--line); padding: 6px 4px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
.tabbar button { min-height: 52px; display: grid; justify-items: center; align-content: center; gap: 3px; background: none; border: 0; color: var(--muted); font-size: 11px; font-weight: 600; border-radius: 12px; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--teal); font-weight: 800; }
:root[data-theme="dark"] .tabbar button[aria-current="page"] { color: #7FD3DD; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabbar button[aria-current="page"] { color: #7FD3DD; } }
.tabbar button[aria-current="page"] .ti { background: var(--sun); color: var(--ink); }
.tabbar .ti { display: grid; place-items: center; width: 46px; height: 28px; border-radius: 99px; }

/* Botón SOS flotante */
.sos-fab { position: absolute; right: 16px; bottom: 92px; z-index: 25; display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 99px; background: var(--alert); color: var(--white); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font: 900 1rem/1 var(--font-display); }
.sos-fab svg { width: 18px; height: 18px; }

/* ---------- Componentes ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 20px; border-radius: 99px; border: 3px solid var(--ink); font: 800 1rem/1 var(--font-body); box-shadow: 0 4px 0 var(--ink); transition: transform .1s; text-decoration: none; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.block { width: 100%; }
.btn-primary { background: var(--teal); color: var(--white); }
.btn-coral { background: var(--coral); color: var(--ink); }
.btn-sun { background: var(--sun); color: var(--ink); }
.btn-white { background: var(--white); color: var(--ink); }
.btn-ghost { background: transparent; color: var(--fg); box-shadow: none; border-color: var(--line); }
.btn-red { background: var(--alert); color: var(--white); }
.link { background: none; border: 0; color: var(--link); font-weight: 700; padding: 8px 0; text-decoration: underline; text-underline-offset: 3px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 14px; }
.card.ink { border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 10px; }
.section-title h2 { font-size: 1.15rem; font-weight: 900; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 800; white-space: nowrap; }
.pill.ok { background: #D6F1E3; color: #0F5A39; } .pill.warn { background: #FCEBC9; color: #6E4710; }
.pill.red { background: #FBDADA; color: #8E2222; } .pill.teal { background: var(--tint); color: var(--link); }
.pill.sun { background: var(--sun); color: var(--ink); } .pill.grey { background: var(--chip); color: var(--muted); }
.example-tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px; border: 2px dashed var(--muted); color: var(--muted); }
.disclaimer { display: flex; gap: 10px; align-items: flex-start; background: var(--tint); border-radius: 14px; padding: 12px; font-size: 13px; }
.disclaimer svg { width: 20px; height: 20px; flex: none; color: var(--link); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: none; min-height: 40px; padding: 8px 14px; border-radius: 99px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 13px; color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--white); border-color: var(--ink); }
:root[data-theme="dark"] .chip[aria-pressed="true"] { background: var(--sun); color: var(--ink); border-color: var(--sun); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { background: var(--sun); color: var(--ink); border-color: var(--sun); } }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); width: 100%; text-align: left; color: var(--fg); }
.list-item .ico { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--tint); color: var(--link); }
.list-item .ico svg { width: 22px; height: 22px; }
.list-item b { display: block; font-weight: 700; }
.list-item .chev { width: 18px; height: 18px; color: var(--muted); flex: none; }

/* Formularios */
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.field input, .field select { width: 100%; min-height: 50px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); }
.field input:focus, .field select:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(18,124,140,.25); }
.check { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--teal); }
.error { color: var(--alert); font-size: 13px; font-weight: 600; }
.error:empty { display: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--chip); padding: 4px; border-radius: 14px; }
.seg button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-weight: 700; color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 2px 0 var(--ink); border: 2px solid var(--ink); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--teal); color: #FFFFFF; border-color: #7FD3DD; box-shadow: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: var(--teal); color: #FFFFFF; border-color: #7FD3DD; box-shadow: none; } }

/* Interruptor */
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--chip); border: 2px solid var(--line); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--white); border: 2px solid var(--ink); transition: transform .15s; }
.switch input:checked + span { background: var(--teal); border-color: var(--teal); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--sun); outline-offset: 2px; }

/* ---------- Splash y onboarding ---------- */
.splash { height: 100%; display: grid; place-items: center; align-content: center; gap: 18px; background: var(--teal); color: var(--white); text-align: center; padding: 24px; }
.splash svg.pup { width: 170px; animation: pop .7s cubic-bezier(.2,1.5,.4,1) both; }
.splash h1 { font-size: 3rem; font-weight: 900; }
.splash p { opacity: .9; }
@keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
.onb { height: 100%; display: flex; flex-direction: column; padding: 16px 22px 26px; }
.onb .skip { align-self: flex-end; }
.onb .art { flex: 1; display: grid; place-items: center; }
.onb .art .blob { width: 250px; height: 250px; border-radius: 42% 58% 50% 50% / 50% 42% 58% 50%; border: 4px solid var(--ink); display: grid; place-items: center; }
.onb .art svg { width: 150px; height: 150px; }
.onb h1 { font-size: 1.9rem; font-weight: 900; }
.onb p { color: var(--muted); margin: 10px 0 20px; font-size: 16px; }
.dots { display: flex; gap: 8px; margin-bottom: 18px; }
.dots i { width: 10px; height: 10px; border-radius: 99px; background: var(--line); transition: width .2s; }
.dots i.on { width: 28px; background: var(--coral); }

/* ---------- Inicio ---------- */
.hello { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 14px; }
.hello small { color: var(--muted); font-weight: 600; }
.hello h1 { font-size: 1.7rem; font-weight: 900; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--sun); border: 3px solid var(--ink); display: grid; place-items: center; font: 900 1.1rem var(--font-display); color: var(--ink); }
.pet-hero { display: flex; gap: 14px; align-items: center; background: var(--teal); color: var(--white); border: 3px solid var(--ink); border-radius: 24px; padding: 14px; box-shadow: 0 5px 0 var(--ink); }
.pet-hero .pic { width: 74px; height: 74px; border-radius: 50%; background: var(--sun); border: 3px solid var(--ink); overflow: hidden; flex: none; display: grid; place-items: center; }
.pet-hero .pic svg { width: 76px; height: 76px; margin-top: 10px; }
.pet-hero h2 { font-size: 1.5rem; font-weight: 900; }
.pet-hero .meta { font-size: 13px; opacity: .92; }
.pet-hero .streak { margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--sun); font-weight: 800; font-size: 12px; padding: 4px 10px; border-radius: 99px; }
.progress-card { display: flex; gap: 16px; align-items: center; }
.ring { --p: 0; width: 86px; height: 86px; flex: none; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--teal) calc(var(--p) * 1%), var(--chip) 0); transition: --p .5s; }
.ring > div { width: 66px; height: 66px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font: 900 1.25rem var(--font-display); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.week span { display: grid; place-items: center; height: 26px; border-radius: 8px; background: var(--chip); font-size: 11px; font-weight: 800; color: var(--muted); }
.week span.done { background: var(--teal); color: var(--white); }
.week span.today { outline: 2px solid var(--coral); outline-offset: 1px; }
.task { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); text-align: left; color: var(--fg); transition: transform .12s; }
.task:active { transform: scale(.98); }
.task .box { width: 30px; height: 30px; flex: none; border-radius: 10px; border: 3px solid var(--ink); display: grid; place-items: center; background: var(--card); }
.task .box svg { width: 18px; height: 18px; opacity: 0; color: var(--white); }
.task.done .box { background: var(--ok); border-color: var(--ok); }
.task.done .box svg { opacity: 1; animation: pop .35s ease both; }
.task.done .t-title { text-decoration: line-through; color: var(--muted); }
.task .t-title { font-weight: 700; display: block; }
.who { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; font: 900 .8rem var(--font-display); border: 2px solid var(--ink); color: var(--ink); flex: none; }
.notif-meter { display: flex; align-items: center; gap: 10px; }
.notif-meter .bars { display: flex; gap: 4px; }
.notif-meter .bars i { width: 20px; height: 8px; border-radius: 99px; background: var(--chip); }
.notif-meter .bars i.on { background: var(--coral); }
.capsule-card { display: flex; gap: 12px; align-items: center; background: var(--sun); color: var(--ink); border: 3px solid var(--ink); border-radius: 20px; padding: 14px; width: 100%; text-align: left; box-shadow: 0 4px 0 var(--ink); }
.capsule-card .art { width: 56px; height: 56px; border-radius: 16px; background: var(--white); border: 2px solid var(--ink); display: grid; place-items: center; flex: none; }
.capsule-card .art svg { width: 30px; height: 30px; }

/* ---------- Calendario ---------- */
.days-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.days-strip button { display: grid; justify-items: center; gap: 2px; padding: 8px 0; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--fg); }
.days-strip button small { font-size: 11px; color: var(--muted); font-weight: 700; }
.days-strip button b { font: 900 1.1rem var(--font-display); }
.days-strip button[aria-pressed="true"] { background: var(--teal); border-color: var(--ink); color: var(--white); }
.days-strip button[aria-pressed="true"] small { color: var(--white); }
.days-strip button .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }
.reminder .when { font-weight: 800; font-size: 13px; color: var(--link); }

/* ---------- Ficha clínica ---------- */
.vet-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.weight-chart { width: 100%; height: auto; }
.docs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.doc { aspect-ratio: 3/4; border-radius: 14px; border: 2px dashed var(--muted); display: grid; place-items: center; text-align: center; padding: 8px; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--card); }
.doc.add { border-color: var(--teal); color: var(--link); }
.doc svg { width: 28px; height: 28px; }

/* ---------- Mapa ---------- */
.map { position: relative; height: 270px; border-radius: 22px; overflow: hidden; border: 3px solid var(--ink);
  background:
    linear-gradient(90deg, transparent 47%, #FFFFFF 47% 53%, transparent 53%) 0 0 / 74px 74px,
    linear-gradient(0deg, transparent 46%, #FFFFFF 46% 54%, transparent 54%) 0 0 / 74px 74px, #E7F1EC; }
.map .park { position: absolute; border-radius: 16px; background: #C8E6D2; }
.map .radius { position: absolute; left: 50%; top: 52%; width: 230px; height: 230px; margin: -115px 0 0 -115px; border-radius: 50%; border: 2px dashed var(--teal); background: rgba(18,124,140,.08); }
.map .me { position: absolute; left: 50%; top: 52%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #2F7DF6; border: 3px solid #FFFFFF; box-shadow: 0 0 0 6px rgba(47,125,246,.25); animation: pulse 2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(47,125,246,.08); } }
.map .pin { position: absolute; width: 32px; height: 32px; margin: -32px 0 0 -16px; border: 0; background: none; padding: 0; }
.map .pin span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid var(--ink); }
.map .pin svg { width: 15px; height: 15px; transform: rotate(45deg); color: var(--white); }
.map .label-ex { position: absolute; left: 10px; top: 10px; background: var(--white); color: var(--ink); font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 8px; border: 2px solid var(--ink); }
.cat-urg { background: var(--alert); } .cat-vet { background: var(--teal); } .cat-tienda { background: var(--coral); } .cat-parque { background: var(--ok); }
.dist { font-weight: 800; font-size: 13px; color: var(--link); white-space: nowrap; }

/* ---------- SOS ---------- */
.sos-screen { min-height: 100%; background: var(--alert); color: var(--white); padding: 14px 20px 30px; display: grid; gap: 16px; align-content: start; }
.sos-screen .topbar h1 { color: var(--white); }
.sos-screen .icon-btn { background: var(--white); color: var(--ink); }
.sos-big { display: grid; place-items: center; gap: 6px; text-align: center; }
.sos-big .ring-s { width: 150px; height: 150px; border-radius: 50%; background: var(--white); color: var(--alert); border: 4px solid var(--ink); display: grid; place-items: center; font: 900 2.6rem var(--font-display); box-shadow: 0 0 0 0 rgba(255,255,255,.6); animation: sosPulse 1.6s infinite; }
@keyframes sosPulse { 70% { box-shadow: 0 0 0 26px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
.sos-card { background: var(--white); color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; padding: 16px; box-shadow: 0 5px 0 var(--ink); display: grid; gap: 10px; }
.sos-card .muted { color: #56626C; }

.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

var KEY = "locky-demo-v2";

function load() {
  try { var raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : null; } catch (e) { S = null; }
  if (!S) S = JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function reset() { try { localStorage.removeItem(KEY); } catch (e) {} S = JSON.parse(JSON.stringify(DEFAULT_STATE)); }

/* =========================================================
   NAVEGACIÓN
   ========================================================= */
function go(name, params, opts) {
  opts = opts || {};
  if (!opts.replace && !opts.root) stack.push(view);
  if (opts.root) stack = [];
  view = { name: name, params: params || {} };
  render(true);
}
function back() { view = stack.pop() || { name: "home", params: {} }; render(true); }
function tabOf(name) {
  if (["home"].indexOf(name) > -1) return "home";
  if (["calendar"].indexOf(name) > -1) return "calendar";
  if (["health"].indexOf(name) > -1) return "health";
  if (["map", "service"].indexOf(name) > -1) return "map";
  if (["more", "achievements", "learn", "capsule", "family", "settings", "profile", "specialists"].indexOf(name) > -1) return "more";
  return null;
}

function render(scrollTop) {
  var html = (SCREENS[view.name] || SCREENS.home)();
  var tab = tabOf(view.name);
  var chrome = '<div class="statusbar" aria-hidden="true"><span>9:41</span><span class="icons"><i></i></span></div>';
  if (view.name === "sos" || view.name === "splash") chrome = "";
  var tabbar = "";
  if (tab) {
    var defs = [["home", "home", "Inicio"], ["calendar", "cal", "Calendario"], ["health", "health", "Salud"], ["map", "map", "Mapa"], ["more", "more", "Más"]];
    tabbar = '<nav class="tabbar" aria-label="Navegación principal">' + defs.map(function (d) { return '<button data-act="tab" data-to="' + d[0] + '"' + (tab === d[0] ? ' aria-current="page"' : "") + '><span class="ti">' + ic(d[1]) + "</span>" + d[2] + "</button>"; }).join("") + "</nav>" +
      '<button class="sos-fab" data-act="sos" aria-label="Abrir SOS de emergencia">' + ic("sos") + " SOS</button>";
  }
  app.innerHTML = chrome + html + tabbar;
  var sc = app.querySelector(".screen");
  if (sc && scrollTop) sc.scrollTop = 0;
  var h = app.querySelector("h1");
  if (scrollTop && h && view.name !== "splash") { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  if (view.name === "sos") sosTimer();
  if (view.name === "register") bindRegister();
}
function sosTimer() {
  var el = document.getElementById("sos-time"), t0 = performance.now();
  setTimeout(function () { if (el) el.textContent = ((performance.now() - t0) / 1000).toLocaleString("es-CL", { maximumFractionDigits: 1 }) + " s"; }, reduce ? 0 : 900);
}
function bindRegister() {
  var age = document.getElementById("r-age");
  age.addEventListener("change", function () { document.getElementById("r-adult").hidden = age.value !== "15-17"; });
}

   AVISOS Y HOJAS
   ========================================================= */
var toastTimer;
function toast(title, text, icon) {
  var old = app.querySelector(".toast"); if (old) old.remove();
  var el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status");
  el.innerHTML = '<span class="ti">' + ic(icon || "bell") + "</span><div><b>" + title + "</b><span>" + text + "</span></div>";
  app.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.remove(); }, 3200);
}
function confetti() {
  if (reduce) return;
  var c = document.createElement("div"); c.className = "confetti";
  var colors = ["#FF7A59", "#FFC845", "#127C8C", "#7FD3DD"];
  for (var i = 0; i < 36; i++) { var p = document.createElement("i"); p.style.left = Math.random() * 100 + "%"; p.style.background = colors[i % 4]; p.style.animationDelay = Math.random() * .4 + "s"; c.appendChild(p); }
  app.appendChild(c); setTimeout(function () { c.remove(); }, 2000);
}
var lastFocus;
function sheet(html) {
  closeSheet();
  lastFocus = document.activeElement;
  var w = document.createElement("div"); w.className = "sheet-wrap"; w.setAttribute("data-act", "close-sheet");
  w.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' + html + "</div>";
  app.appendChild(w);

}

    var extra = S.sessions.length >= 1, sp = SPECS[ui.spec], rid = "r" + Date.now();
    S.reminders.push({ id: rid, title: "Sesión con " + sp.name.toLowerCase(), type: "especialista", day: ui.sday, time: ui.slot, repeat: ui.mode === "online" ? "En línea" : "Presencial", who: "M", priority: 1, done: false });
    S.sessions.push({ id: "s" + Date.now(), rid: rid, spec: ui.spec, mode: ui.mode, day: ui.sday, time: ui.slot, extra: extra });
    ui.slot = null; save(); closeSheet(); render();
    toast("Sesión agendada (demo)", sp.name + " · " + dayLabel(S.sessions[S.sessions.length - 1].day).toLowerCase() + ". Te la recordamos en el calendario.", "video");
    if (!extra) confetti();
  },
  "s-cancel": function (el) {
    var x = S.sessions.filter(function (y) { return y.id === el.dataset.id; })[0];
    S.sessions = S.sessions.filter(function (y) { return y !== x; });
    S.reminders = S.reminders.filter(function (r) { return r.id !== x.rid; });
    save(); render(); toast("Sesión cancelada", "Se quitó también de tu calendario.", "cal");
  },
  "add-allergy": function () {
    sheet('<h2>Agregar alergia</h2><div class="stack"><div class="field"><label for="a-name">¿A qué es alérgico?</label><input id="a-name" placeholder="Ej.: pollo, picadura de pulga"></div><button class="btn btn-coral block" data-act="save-allergy">Guardar</button><button class="btn btn-ghost block" data-act="close-sheet">Cancelar</button></div>');
  },
  "save-allergy": function () { var v = document.getElementById("a-name").value.trim(); if (!v) return; S.allergies.push(v); save(); closeSheet(); render(); toast("Alergia guardada", "Aparecerá en la ficha que compartes en una urgencia.", "check"); },
  "export": function () {
    sheet('<h2>Ficha de ' + esc(S.pet.name) + ' (PDF)</h2><div class="card stack small"><div class="row"><svg viewBox="0 0 48 48" style="width:36px;height:36px" aria-hidden="true"><use href="#logo-mark"/></svg><b class="grow">Resumen clínico</b><span class="muted">' + dfmt(0) + '</span></div>' +
      "<div><b>" + esc(S.pet.name) + "</b> · " + esc(S.pet.species) + " · " + esc(S.pet.breed) + " · " + esc(S.pet.weight) + " kg</div>" +
      "<div><b>Vacunas:</b> " + S.vaccines.map(function (v) { return esc(v.name) + " (" + v.date + ")"; }).join(", ") + "</div>" +
      "<div><b>Alergias:</b> " + (S.allergies.length ? S.allergies.map(esc).join(", ") : "Sin registro") + "</div>" +
      "<div><b>Tratamientos:</b> " + S.treatments.map(function (t) { return esc(t.name) + " (" + t.status + ")"; }).join(", ") + "</div>" +
      "<div><b>Tutor:</b> " + esc(S.user.name) + (S.user.age === "15-17" ? " · Adulto responsable: " + esc(S.user.adultName) : "") + "</div></div>" +
      '<p class="small muted" style="margin:10px 0">Demo: en la app real este resumen se descarga como PDF para llevarlo al veterinario.</p><button class="btn btn-primary block" data-act="close-sheet-btn">Listo</button>');
  },
  "close-sheet-btn": function () { closeSheet(); },
  "map-cat": function (el) { ui.mapCat = el.dataset.cat; render(); },
  "service": function (el) { go("service", { id: el.dataset.id }); },
  "call": function (el) { var s = SERVICES.filter(function (x) { return x.id === el.dataset.id; })[0]; toast("Llamada simulada", "Número de ejemplo: " + s.phone.replace(" (ejemplo)", ""), "phone"); },
  "directions": function () { toast("Cómo llegar", "En la app real se abre Google Maps o Waze con la ruta.", "route"); },
  "fav": function (el) { S.favUrgency = el.dataset.id; save(); render(); toast("Urgencia favorita", "Disponible sin internet en el botón SOS.", "star"); },
  "sos": function () { go("sos"); },
  "share-sos": function () { toast("Compartido (simulación)", "Ubicación y ficha resumida enviadas a " + esc(S.user.adultName || "tu familia") + ".", "share"); },
  "learn-cat": function (el) { ui.learnCat = el.dataset.cat; render(); },
  "capsule": function (el) { go("capsule", { id: el.dataset.id }); },
  "mark-read": function (el) {
    var id = el.dataset.id; if (S.read.indexOf(id) > -1) return;
    S.read.push(id); save(); render();
    if (S.read.length === 3) { toast("Logro desbloqueado", "Lector curioso: leíste 3 cápsulas.", "star"); confetti(); }
    else toast("¡Bien!", "Cápsula leída. Llevas " + S.read.length + ".", "book");
  },
  "invite": function () {
    sheet('<h2>Invitar a alguien del hogar</h2><div class="stack"><div class="field"><label for="i-name">Nombre</label><input id="i-name" placeholder="Ej.: Tomás"></div><div class="field"><label for="i-mail">Correo</label><input id="i-mail" type="email" placeholder="nombre@correo.cl"></div><button class="btn btn-coral block" data-act="save-invite">Enviar invitación</button><button class="btn btn-ghost block" data-act="close-sheet">Cancelar</button></div>');
  },
  "save-invite": function () {
    var n = document.getElementById("i-name").value.trim(); if (!n) return;
    S.family.push({ id: "X" + Date.now(), name: n, role: "Invitación enviada", color: "#C9E9B8" }); save(); closeSheet(); render();
    toast("Invitación enviada (simulación)", n + " podrá unirse al plan familiar.", "users");
  },
  "setting": function (el) { S.notif[el.dataset.key] = el.checked; save(); toast("Ajuste guardado", el.checked ? "Activado." : "Desactivado.", "gear"); },
  "preview-notif": function () { toast("Locky · Toby", "Mañana toca la vacuna antirrábica, 10:30.", "bell"); },
  "theme": function (el) { S.dark = el.dataset.theme; save(); applyTheme(); render(); },
  "export-data": function () { toast("Descarga simulada", "En la app real recibes un archivo con todos tus datos.", "download"); },
  "delete-account": function () {
    sheet('<h2>¿Eliminar tu cuenta?</h2><p class="muted" style="margin-bottom:14px">Se borrarán tus datos y los de ' + esc(S.pet.name) + ". Esta acción no se puede deshacer.</p><div class=\"stack\"><button class=\"btn btn-red block\" data-act=\"confirm-delete\">Sí, eliminar (demo)</button><button class=\"btn btn-ghost block\" data-act=\"close-sheet-btn\">Cancelar</button></div>");
  },
  "confirm-delete": function () { reset(); closeSheet(); stack = []; view = { name: "splash", params: {} }; ui.onb = 0; render(true); },
  "reset": function () { reset(); stack = []; ui.onb = 0; view = { name: "splash", params: {} }; render(true); }
};

app.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el || !app.contains(el)) return;
  var fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.dataset.act === "setting") return; // lo maneja "change"
  fn(el, e);
});
app.addEventListener("change", function (e) { if (e.target.dataset && e.target.dataset.act === "setting") ACTIONS.setting(e.target); });
app.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

/* Guía lateral: saltar a una pantalla */
document.querySelectorAll("[data-jump]").forEach(function (b) {
  b.addEventListener("click", function () {
    var to = b.dataset.jump;
    if (to === "splash") { ui.onb = 0; stack = []; view = { name: "splash", params: {} }; render(true); return; }
    if (to === "reset") { ACTIONS.reset(); return; }
    if (!S.started) { S.started = true; save(); }
    go(to, {}, { root: TABS.indexOf(to) > -1 || to === "sos" });
  });
});

function applyTheme() {
  if (S.dark === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.dark);
}
document.documentElement.lang = "es-CL";
applyTheme();
render(true);
</script>
</body>
</html>
